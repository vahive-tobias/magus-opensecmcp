name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned for the same reason Cargo.lock is committed and pinned:
          # a floating `@stable` means "whatever Rust happens to be current
          # the day CI runs," which makes a red build non-reproducible and
          # impossible to bisect later — you can't tell "my code changed"
          # apart from "the toolchain moved out from under me between runs."
          # Bump this deliberately, on purpose, in its own commit, not as a
          # side effect of the toolchain releasing something new.
          toolchain: 1.97.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code compilation
        run: cargo check --verbose

      - name: Run unit tests
        run: cargo test --verbose

      - name: Verify release build
        run: cargo build --release --verbose
