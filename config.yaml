# config.yaml
#
# Point your MCP client (Claude Desktop, Claude Code, Cursor, etc.) at
# `magus-gateway` instead of the real server directly. The gateway spawns
# the real server itself (below) and only forwards what it approves.
#
# This tool list and every hash below came from a real run against the real
# package (`npx -y @modelcontextprotocol/server-filesystem`), captured by the
# gateway's own startup log, not typed from memory. move_file's pin below is
# deliberately wrong by one character, on purpose, left in so that on your
# first run you SEE real enforcement fire instead of taking the hash-pinning
# feature on faith: strict_schema_pinning defaults to true, so move_file
# comes up quarantined (absent from tools/list, rejected if called by name)
# until you fix the pin. Fix it once you've watched it catch it.
#
# Detection rules live separately now, in locked-rules.yaml (shipped inside
# the binary) and optionally user-rules.yaml (create it next to this file --
# see user-rules.example.yaml). Nothing in this file configures detection.
#
# if you are running this through Windows and the gateway fails 
# change -> command: "npx" to command: "npx.cmd" at line 20

downstream_servers:
  - server_id: "local-filesystem"
    transport: "stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/magus-demo"]
    source_grade: "Known"

tools:
  - mcp_server_id: "local-filesystem"
    tool_name: "read_file"
    risk_class: "Low"
    authority_source: "User"
    pinned_definition_hash_hex: "ef9bdf6835eef44169d6718b069f991af4137bd24b33d88d4b8f2f906d67339f"

